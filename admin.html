<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Muskan Pandit Interiors</title><meta name="claude:viewport-fit-sides" content="cover"><meta name="description" content="Interior design portfolio of Muskan Pandit: residential interiors, wardrobe planning, kitchens, bedrooms and 3D visualization."><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap"><style id="app-css">/* Layout: colour-blocked, image-led. Moving rows of arch and pill shaped renders, one bright panel per project, soft floating shapes. */
:root {
  --bg: #fff7ea; --ink: #1e1b2e;
  --c1: #ffc53d; --c2: #ff6b4a; --c3: #3cc4b6; --c4: #5aa9f6;
  --accent: var(--c2); --on-c: #1e1b2e;
  --sand: var(--ink); --on-sand: var(--bg); --danger: #d6402a;
  --line: color-mix(in srgb, var(--ink) 14%, transparent);
  --muted: color-mix(in srgb, var(--ink) 62%, var(--bg));
  --surface: color-mix(in srgb, var(--bg) 92%, var(--ink));
  --shadow: rgba(30, 27, 46, 0.28);
  --f-display: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif;
  --f-body: 'DM Sans', 'Avenir Next', system-ui, sans-serif;
  --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
  --r: clamp(22px, 4vw, 42px);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; overflow-x: hidden; transition: background 0.4s; }
body.lock { overflow: hidden; }
body::before { content: ''; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 70; }
img { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--c4); outline-offset: 3px; border-radius: 6px; }
::selection { background: var(--c1); color: var(--on-c); }
.wrap { width: 100%; max-width: 1360px; margin-inline: auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.icon { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* type */
.display { font-family: var(--f-display); font-weight: 700; letter-spacing: -0.04em; line-height: 0.96; margin: 0; text-wrap: balance; }
.h1 { font-size: clamp(2.6rem, 10.5vw, 6.6rem); }
.h2 { font-size: clamp(2.1rem, 7vw, 4.2rem); }
.kicker { margin: 0; font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.lede { font-size: clamp(1.05rem, 2vw, 1.25rem); line-height: 1.6; max-width: 56ch; margin: 0; }
.hl { background: linear-gradient(transparent 58%, var(--c1) 58% 90%, transparent 90%); padding-inline: 0.06em; margin-inline: -0.06em; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; min-height: 52px; padding: 0 1.6rem; border-radius: 999px; border: 2px solid var(--ink); background: var(--ink); color: var(--bg); font-family: var(--f-body); font-size: 0.92rem; font-weight: 700; text-decoration: none; transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), background 0.3s, color 0.3s; }
.btn:hover { transform: translateY(-3px) rotate(-1deg); box-shadow: 0 12px 0 -4px var(--c1); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--ink); color: var(--bg); }
.btn.small { min-height: 40px; padding: 0 1.05rem; font-size: 0.82rem; }
.btn.wa { background: #1fa35c; border-color: #1fa35c; color: #fff; }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.ib { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 2px solid transparent; border-radius: 50%; }
.ib:hover { border-color: var(--line); }

/* reveal */
[data-rv] { transition: opacity 0.9s var(--ease), transform 0.9s var(--ease); transition-delay: var(--d, 0s); }
[data-rv].pre { opacity: 0; transform: translateY(40px) scale(0.985); }
[data-rv].pre.in { opacity: 1; transform: none; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: transform 0.5s var(--ease); }
.top.hide { transform: translateY(-110%); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 64px; }
.brand { font-family: var(--f-display); font-weight: 800; letter-spacing: -0.03em; font-size: 1.25rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; }
.brand::before { content: ''; width: 14px; height: 14px; border-radius: 50%; background: var(--c2); box-shadow: 10px 0 0 -2px var(--c1), 20px 0 0 -4px var(--c3); margin-right: 18px; }
.links { display: none; gap: 1.8rem; }
.links a { text-decoration: none; font-weight: 600; font-size: 0.95rem; }
.links a:hover { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; text-decoration-color: var(--c2); }
.top-act { display: flex; align-items: center; gap: 0.5rem; }
@media (min-width: 860px) { .links { display: flex; } }
.prog { position: fixed; left: 0; top: env(safe-area-inset-top, 0px); height: 4px; width: 100%; transform-origin: left; transform: scaleX(0); z-index: 80; background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c4)); }

/* hero */
.hero { position: relative; padding-top: clamp(20px, 5vw, 56px); padding-bottom: clamp(36px, 6vw, 80px); overflow: hidden; }
.hero-top { position: relative; display: grid; gap: 1.2rem; z-index: 1; }
.name { font-family: var(--f-display); font-weight: 800; letter-spacing: -0.055em; line-height: 0.84; font-size: clamp(4rem, 23vw, 13rem); margin: 0; }
.name .ln { display: block; overflow: hidden; padding-bottom: 0.1em; margin-bottom: -0.06em; }
.name .ln > span { display: block; transform: translateY(110%); animation: rise 1.2s var(--ease) forwards; }
.name .ln:nth-child(2) > span { animation-delay: 0.12s; }
@keyframes rise { to { transform: none; } }
.hero-tag { font-size: clamp(1.1rem, 2.6vw, 1.5rem); font-weight: 500; max-width: 26ch; line-height: 1.35; margin: 0; opacity: 0; animation: fadeUp 1s 0.5s var(--ease) forwards; }
.cta { display: flex; flex-wrap: wrap; gap: 0.7rem; opacity: 0; animation: fadeUp 1s 0.7s var(--ease) forwards; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.shape { position: absolute; z-index: 0; pointer-events: none; will-change: transform; }
.shape.sun { width: clamp(70px, 16vw, 190px); aspect-ratio: 1; border-radius: 50%; background: var(--c1); right: 6%; top: 2%; animation: bob 7s ease-in-out infinite; }
.shape.arch { width: clamp(56px, 12vw, 140px); aspect-ratio: 0.72; border-radius: 999px 999px 0 0; background: var(--c3); right: 27%; top: -2%; animation: bob 9s -3s ease-in-out infinite; }
.shape.dot { width: clamp(26px, 5vw, 60px); aspect-ratio: 1; border-radius: 50%; background: var(--c2); right: 3%; top: 38%; animation: bob 6s -1s ease-in-out infinite; }
.shape.half { width: clamp(50px, 10vw, 110px); aspect-ratio: 2; border-radius: 999px 999px 0 0; background: var(--c4); right: 40%; top: 4%; animation: bob 8s -2s ease-in-out infinite; transform: rotate(-12deg); }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-18px) rotate(6deg); } }
.strips { display: grid; gap: 12px; margin-top: clamp(28px, 6vw, 64px); --th: clamp(140px, 36vw, 300px); -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); }
.strip { display: flex; gap: 12px; width: max-content; padding-right: 12px; animation: run var(--dur, 70s) linear infinite; will-change: transform; }
.strip.b { animation-direction: reverse; }
.strips:hover .strip { animation-play-state: paused; }
@keyframes run { to { transform: translateX(-50%); } }
.tile { flex: none; height: var(--th); padding: 0; border: 0; overflow: hidden; background: var(--surface); position: relative; border-radius: 22px; transition: transform 0.5s var(--ease); }
.tile.arch { border-radius: 999px 999px 22px 22px; }
.tile.pill { border-radius: 999px; }
.tile img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.9s var(--ease); }
.tile:hover { transform: translateY(-6px); }
.tile:hover img { transform: scale(1.08); }
@media (min-width: 900px) {
  .hero-top { grid-template-columns: 1.1fr 0.9fr; align-items: end; }
  .hero-top .copy { display: grid; gap: 1.4rem; }
  .name { font-size: clamp(6rem, 13vw, 13rem); }
}

/* work */
.sec { padding-block: clamp(48px, 9vw, 110px); }
.work-head { display: grid; gap: 1rem; margin-bottom: 1.6rem; }
.filters { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.6rem; margin-inline: -18px; padding-inline: 18px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 44px; padding: 0 1.2rem; background: transparent; border: 2px solid var(--ink); border-radius: 999px; font-size: 0.88rem; font-weight: 700; transition: all 0.3s var(--ease); }
.chip:hover { transform: translateY(-2px) rotate(-1.5deg); }
.chip[aria-pressed='true'] { background: var(--ink); color: var(--bg); }
.blocks { display: grid; gap: clamp(14px, 3vw, 28px); margin-top: 1rem; transition: opacity 0.25s; }
.blk { --bc: var(--c1); background: var(--bc); color: var(--on-c); border-radius: var(--r); padding: clamp(12px, 2.6vw, 30px); display: grid; gap: clamp(16px, 3vw, 30px); position: relative; overflow: hidden; }
.blk[data-c='2'] { --bc: var(--c2); }
.blk[data-c='3'] { --bc: var(--c3); }
.blk[data-c='4'] { --bc: var(--c4); }
.blk-media { display: grid; gap: 10px; min-width: 0; }
.blk-main { position: relative; border-radius: calc(var(--r) - 10px); overflow: hidden; cursor: pointer; background: color-mix(in srgb, var(--ink) 8%, var(--bc)); box-shadow: 0 24px 40px -22px rgba(0, 0, 0, 0.4); }
.blk-main .ph, .blk-th .ph { transition: transform 1.2s var(--ease), clip-path 1.5s var(--ease); clip-path: inset(0); }
.blk-main:hover .ph, .blk-th:hover .ph { transform: scale(1.05); }
.blk.pre:not(.in) .blk-main .ph { clip-path: inset(0 0 100% 0); }
.blk.pre:not(.in) .blk-th .ph { clip-path: inset(100% 0 0 0); }
.blk-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.blk-th { position: relative; border-radius: 18px; overflow: hidden; cursor: pointer; background: color-mix(in srgb, var(--ink) 8%, var(--bc)); }
.blk-th:nth-child(1) { border-radius: 999px 999px 18px 18px; }
.blk-more { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--ink) 70%, transparent); color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; }
.blk-info { display: grid; gap: 0.8rem; align-content: center; padding: 6px 6px 10px; min-width: 0; }
.tag { justify-self: start; padding: 0.3rem 0.85rem; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; }
.blk-info h3 { margin: 0; font-family: var(--f-display); font-weight: 800; letter-spacing: -0.045em; line-height: 0.95; font-size: clamp(2.2rem, 8vw, 4rem); text-wrap: balance; }
.blk-info p { margin: 0; font-weight: 500; }
.blk-info .go { margin-top: 0.4rem; justify-self: start; }
.blk .btn:hover { box-shadow: 0 12px 0 -4px rgba(255, 255, 255, 0.55); }
@media (min-width: 900px) {
  .blk { grid-template-columns: 1.55fr 1fr; align-items: center; }
  .blk:nth-child(even) { grid-template-columns: 1fr 1.55fr; }
  .blk:nth-child(even) .blk-media { order: 2; }
  .blk-info { padding: 10px 14px; }
}
.empty { padding: 3rem 0; color: var(--muted); }

/* images */
.ph { position: relative; margin: 0; width: 100%; background: color-mix(in srgb, var(--ink) 7%, var(--bg)); }
.ph img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.8s var(--ease); }
.ph.on img { opacity: 1; }
.ph.err::after { content: 'Image unavailable'; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 0.8rem; }
.ph:not([style]) { aspect-ratio: 4 / 3; }
[data-tilt] { transition: transform 0.6s var(--ease); will-change: transform; }
[data-tilt].tilting { transition: transform 0.08s linear; }

/* about */
.about { display: grid; gap: 2.6rem; }
.portrait { position: relative; max-width: 420px; width: 100%; }
.portrait::before { content: ''; position: absolute; width: 62%; aspect-ratio: 1; border-radius: 50%; background: var(--c2); right: -9%; bottom: -7%; z-index: 0; animation: bob 8s ease-in-out infinite; }
.portrait::after { content: ''; position: absolute; width: 22%; aspect-ratio: 1; border-radius: 50%; background: var(--c1); left: -6%; top: 6%; z-index: 2; animation: bob 6s -2s ease-in-out infinite; }
.portrait .ph { position: relative; z-index: 1; border-radius: 999px 999px 30px 30px; overflow: hidden; }
.hello { display: grid; gap: 1.3rem; align-content: start; }
.cols { display: grid; gap: 2rem; margin-top: 0.6rem; }
.cols h3, .sk h3 { margin: 0 0 0.8rem; font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.edu { display: grid; gap: 1.1rem; }
.edu b { display: block; font-weight: 700; font-size: 1.08rem; }
.edu span { display: block; color: var(--muted); font-size: 0.95rem; }
.edu em { font-style: normal; font-weight: 700; color: var(--c2); }
.pills { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.pill { display: inline-flex; padding: 0.55rem 1.05rem; border-radius: 999px; font-weight: 700; font-size: 0.92rem; background: var(--pc, var(--c1)); color: var(--on-c); transition: transform 0.35s var(--ease); }
.pill:hover { transform: translateY(-3px) rotate(-2deg); }
.pill:nth-child(4n+1) { --pc: var(--c1); } .pill:nth-child(4n+2) { --pc: var(--c3); } .pill:nth-child(4n+3) { --pc: var(--c2); } .pill:nth-child(4n) { --pc: var(--c4); }
.pill.line { background: transparent; border: 2px solid var(--ink); color: var(--ink); }
.sk { display: grid; gap: 2rem; margin-top: 2.4rem; }
@media (min-width: 860px) { .about { grid-template-columns: 0.8fr 1.2fr; gap: clamp(3rem, 7vw, 7rem); align-items: center; } .cols { grid-template-columns: 1fr 1fr; gap: 3rem; } }

/* contact */
.contact { background: var(--c1); color: var(--on-c); border-radius: var(--r); padding: clamp(26px, 6vw, 80px); position: relative; overflow: hidden; display: grid; gap: 1.4rem; }
.contact .shape.sun { background: var(--c2); right: -4%; top: -10%; }
.contact .shape.arch { background: var(--c3); right: 22%; top: auto; bottom: -8%; }
.contact .kicker { color: inherit; opacity: 0.7; }
.contact > * { position: relative; z-index: 1; }
.contact .shape { z-index: 0; position: absolute; }
.soc { display: flex; flex-wrap: wrap; gap: 0.7rem; }
.cgrid { display: grid; gap: 1rem; margin-top: 0.6rem; }
.cline { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.6rem 1rem; padding: 1rem 0; border-top: 2px solid color-mix(in srgb, var(--on-c) 25%, transparent); }
.cline .lab { width: 100%; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; opacity: 0.7; }
.cline .val { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.3rem, 5vw, 2rem); letter-spacing: -0.02em; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
.contact .btn.ghost { color: var(--on-c); border-color: var(--on-c); }
.contact .btn.ghost:hover { background: var(--on-c); color: var(--c1); }
@media (min-width: 860px) { .cgrid { grid-template-columns: 1fr 1fr; gap: 3rem; } }
.foot { padding-block: 1.6rem calc(1.6rem + 90px); display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--muted); }
.link-btn { background: none; border: 0; padding: 0.6rem 0; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.4rem; color: inherit; }
.link-btn:hover { color: var(--ink); }
@media (min-width: 900px) { .foot { padding-bottom: 1.8rem; } }

/* dock */
.dock { position: fixed; z-index: 55; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 6px; border-radius: 999px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5); border: 2px solid var(--ink); box-shadow: 0 8px 0 -2px var(--ink); max-width: calc(100% - 20px); }
.dock a { display: grid; justify-items: center; gap: 2px; min-width: 58px; padding: 8px 10px 7px; border-radius: 999px; text-decoration: none; font-size: 0.62rem; letter-spacing: 0.06em; font-weight: 700; transition: background 0.3s, color 0.3s, transform 0.3s var(--ease); }
.dock a .icon { width: 20px; height: 20px; }
.dock a[aria-current='true'] { background: var(--ink); color: var(--bg); }
.dock a:active { transform: scale(0.92); }
.dock a.wa { background: #1fa35c; color: #fff; margin-left: 4px; }
@media (min-width: 900px) { .dock { display: none; } }
.wa-fab { position: fixed; z-index: 46; right: max(18px, env(safe-area-inset-right, 0px)); bottom: 18px; width: 58px; height: 58px; border-radius: 50%; background: #1fa35c; color: #fff; display: none; place-items: center; box-shadow: 0 8px 0 -2px var(--ink); border: 2px solid var(--ink); animation: bob 4s ease-in-out infinite; }
.wa-fab .icon { width: 28px; height: 28px; }
@media (min-width: 900px) { .wa-fab { display: grid; } }

/* project page */
.layer { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; opacity: 0; visibility: hidden; transform: translateY(6%); transition: opacity 0.45s var(--ease), transform 0.7s var(--ease), visibility 0s 0.7s; }
.layer.open { opacity: 1; visibility: visible; transform: none; transition: opacity 0.45s var(--ease), transform 0.7s var(--ease), visibility 0s; }
.sheet-bar { position: sticky; top: 0; z-index: 5; padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: 10px; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.sheet-bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
.sheet-bar .grp { display: flex; align-items: center; gap: 0.3rem; }
.sheet-hero { --bc: var(--c1); background: var(--bc); color: var(--on-c); border-radius: var(--r); padding: clamp(22px, 5vw, 64px); margin-top: 8px; display: grid; gap: 1rem; position: relative; overflow: hidden; }
.sheet-hero[data-c='2'] { --bc: var(--c2); } .sheet-hero[data-c='3'] { --bc: var(--c3); } .sheet-hero[data-c='4'] { --bc: var(--c4); }
.sheet-hero .kicker { color: inherit; opacity: 0.75; }
.sheet-hero h2 { font-size: clamp(2.6rem, 11vw, 7rem); }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem 1.6rem; margin: 0.6rem 0 0; padding-top: 1.2rem; border-top: 2px solid color-mix(in srgb, var(--on-c) 25%, transparent); }
.meta dt { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; opacity: 0.7; }
.meta dd { margin: 0.15rem 0 0; font-weight: 600; overflow-wrap: anywhere; }
.desc { max-width: 60ch; font-size: 1.1rem; margin: 0.4rem 0 0; font-weight: 500; }
.gal { display: grid; gap: 14px; padding-block: 22px 40px; }
.gal .ph { border-radius: 20px; overflow: hidden; cursor: zoom-in; }
.gal .ph img { transition: transform 1s var(--ease), opacity 0.8s; }
.gal .ph:hover img { transform: scale(1.03); }
@media (min-width: 800px) { .gal { grid-template-columns: 1fr 1fr; align-items: start; } .gal .ph.wide { grid-column: 1 / -1; } }
.next { display: grid; gap: 0.6rem; padding-block: 2rem 5rem; }
.next button { text-align: left; border: 0; padding: clamp(20px, 4vw, 40px); border-radius: var(--r); background: var(--nc, var(--c2)); color: var(--on-c); display: grid; gap: 0.4rem; transition: transform 0.5s var(--ease); }
.next button:hover { transform: translateY(-4px) rotate(-0.6deg); }

    if (!art) return;
    const b = $('#pubbtn'); if (b) { b.disabled = true; b.textContent = 'Publishing…'; }
    art.publish(buildDoc()).then(() => toast('Published. Reloading…'), err => {
      if (b) { b.disabled = false; b.textContent = 'Publish'; }
      const c = err && err.code;
      toast(c === 'conflict' ? 'Someone else published first. Reloading with their version.' : c === 'not_writer' || c === 'not_granted' ? 'You need edit access to publish.' : c === 'too_large' ? 'The site is too large to save. Remove some images.' : c === 'rate_limited' ? 'Too many saves. Wait a moment and try again.' : 'Could not publish. Try again.');
    });
  }
  const TK = 'portfolio_admin_token';
  const getTok = () => { try { const t = JSON.parse(localStorage.getItem(TK) || 'null'); return t && t.exp > Date.now() ? t.token : ''; } catch (e) { return ''; } };
  const setTok = (token, exp) => { try { localStorage.setItem(TK, JSON.stringify({ token, exp })); } catch (e) {} };
  const clearTok = () => { try { localStorage.removeItem(TK); } catch (e) {} };
  function loadRemote() {
    return fetch('/api/data', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(d => {
      if (d && d.profile && Array.isArray(d.projects)) { S.profile = d.profile; S.theme = d.theme || S.theme; S.projects = d.projects; ensure(); renderSite(); }
    }).catch(() => {});
  }
  function uploadRemote(blob) {
    return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = () => rej(new Error('read')); fr.readAsDataURL(blob); })
      .then(data => remote('POST', '/api/upload', { name: blob.name || 'image', type: blob.type || 'image/jpeg', data }))
      .then(r => ({ id: r.url }), err => { if (err.status === 401) { clearTok(); showLogin(); } throw err; });
  }
  function startAdmin() {
    isAdmin = true; art = { publish: () => Promise.resolve() }; assetsNS = { upload: uploadRemote, list: () => Promise.resolve({ usage: null }) };
    mountAdmin(); renderSite(); openAdmin('projects');
  }
  function showLogin(msg) {
    let m = $('#login');
    if (!m) {
      const pw = h('input', { type: 'password', id: 'pw', autocomplete: 'current-password', required: true }), err = h('p', { class: 'note', id: 'login-err', role: 'alert' });
      const btn = h('button', { class: 'btn', type: 'submit' }, 'Sign in');
      const form = h('form', { class: 'modal-card', onsubmit: e => {
        e.preventDefault(); btn.disabled = true; btn.textContent = 'Checking\u2026'; err.textContent = '';
        fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw.value }) })
          .then(r => r.json().catch(() => ({})).then(j => ({ ok: r.ok, j })))
          .then(x => {
            btn.disabled = false; btn.textContent = 'Sign in';
            if (!x.ok) { err.textContent = x.j.error === 'not_configured' ? 'The admin password is not set up on the server yet.' : 'Wrong password. Please try again.'; return; }
            setTok(x.j.token, x.j.exp); pw.value = ''; m.classList.remove('open'); if (!isAdmin) startAdmin(); else renderAdmin();
          }, () => { btn.disabled = false; btn.textContent = 'Sign in'; err.textContent = 'Could not reach the server. Check your internet.'; });
      } }, h('h3', null, 'Studio sign in'), h('p', null, 'Enter your password to edit the portfolio.'), h('label', { class: 'fld' }, h('span', null, 'Password'), pw), err, h('div', null, btn));
      m = h('div', { class: 'modal', id: 'login', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Sign in' }, form); document.body.append(m);
    }
    if (msg) $('#login-err').textContent = msg;
    m.classList.add('open'); setTimeout(() => { const i = $('#pw'); if (i) i.focus(); }, 60);
  }

  ensure(); applyTheme(); buildLayers(); renderSite();
  addEventListener('resize', onScroll);
  if (MODE === 'public') {
    loadRemote();
  } else if (MODE === 'admin') {
    loadRemote().then(() => { if (getTok()) startAdmin(); else showLogin(); });
  } else {
    const c = window.claude;
    if (c && c.use) {
      c.use('user').then(u => u ? u.canEdit() : false, () => false).then(ok => {
        if (!ok) return null;
        return Promise.all([c.use('artifact'), c.use('assets')]).then(r => { if (!r[0]) return; art = r[0]; assetsNS = r[1]; isAdmin = true; mountAdmin(); renderSite(); });
      }).catch(() => {});
    }
  }
})();
</script></body></html>
